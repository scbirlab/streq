[project]
name = "streq"
version = "0.0.4"
authors = [
  { name="Eachan Johnson", email="eachan.johnson@crick.ac.uk" },
  { name="Susannah Parkhill", email="susannah.parkhill@crick.ac.uk" },
]
description = "Basic utilities for working with nucleotide sequence strings."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = ["nucleotide", "sequence", "science"]

classifiers = [  
  
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",

  "License :: OSI Approved :: MIT License",

  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [ 
  "pyyaml",
  "regex",
]

[project.optional-dependencies]
all = []
dev = [
  "pytest",
  "flake8",
]

[project.urls]
"Homepage" = "https://github.com/scbirlab/streq"
"Bug Tracker" = "https://github.com/scbirlab/streq/issues"

[tool.setuptools]
# If there are data files included in your packages that need to be
# installed, specify them here.
package-data = {"streq" = ["*.yml"]}

[build-system]
# These are the assumed default build requirements from pip:
# https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[test]
deps = ["pytest>=7.4", "pytest-cov", "streq[dev]"] 
